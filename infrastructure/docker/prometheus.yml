global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'diplom-monitor'

scrape_configs:
  # Backend API metrics
  - job_name: 'backend'
    static_configs:
      - targets: ['backend:8000']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Node Exporter (системные метрики)
  - job_name: 'node'
    static_configs:
      - targets: ['host.docker.internal:9100']
    # Для Docker Desktop на macOS/Windows используйте host.docker.internal
    # Для Linux добавьте --add-host=host.docker.internal:host-gateway

  # RabbitMQ metrics
  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['rabbitmq:15672']
    metrics_path: '/api/metrics'
    basic_auth:
      username: guest
      password: guest

  # Redis metrics (нужен redis-exporter)
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']

  # PostgreSQL/TimescaleDB metrics (нужен postgres-exporter)
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  # MLflow metrics
  - job_name: 'mlflow'
    static_configs:
      - targets: ['mlflow:5000']
    metrics_path: '/metrics'
